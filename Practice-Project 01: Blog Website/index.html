<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avicious Blogs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="body_container">
    
    <div class="container">

        <!-- Header -->
        <header class="header_container">
            <h1 class="header_title">Avicious Blogs</h1>
            <p class="header_desc">Blogs which is related to our daily life and necessary to our daily life</p>
        </header>

        <!-- Card Container -->
        <div class="main_container">
            <!-- Card 1 starts -->
            <div class="card_container">
                <a href="#" class="card_image_container">
                    <img src="https://images.unsplash.com/photo-1535914254981-b5012eebbd15?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cmFuZG9tJTIwaGVhbHRoeSUyMDYwMCo0MDB8ZW58MHx8MHx8fDA%3D"
                    alt="card 1 img" loading="lazy"/>
                </a>

                <div class="card_title_container">
                    <a href="#">
                        <h2 class="card_title">Healthy Eating Tips</h2>
                        <p class="card_desc">Discover simple tips for maintaining a healthy diet and making nutritious food choices</p>
                    </a>
                </div>

                <div class="card_footer_container">
                    <div class="author_container">
                        <div class="author_avatar_container">
                            <img src="https://api.dicebear.com/7.x/notionists/svg?seed=John?size=64" loading="lazy" class="author_avatar" />
                        </div>
                        <div class="author_info_container">
                            <span> John Doe </span>
                            <span> Sept 19, 2023 </span>
                        </div>
                    </div>

                    <div class="card_tag_container">
                        <span>Nutrition</span>
                    </div>
                </div>
            </div>

            <!-- Card 2 starts -->


        </div>

    </div>

</body>
</html>
